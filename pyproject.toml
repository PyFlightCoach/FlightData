[project]
name = "flightdata"
version = "0.3.9"
description = "Python tools for handling flight data"
readme = "README.md"
authors = [{ name = "Thomas David", email = "thomasdavid0@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.3",
    "pandas>=3.0.5",
    "pfc-geometry>=0.2.23",
    "pfcschemas>=0.1.15",
    "ardupilot_log_reader",
    "scipy>=1.15.2",
    "simplejson>=3.20.1",
]

[project.scripts]
collect_logs = "flightdata.scripts.collect_logs:main"
flightline = "flightdata.scripts.flightline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.optional-dependencies]
dataflash = ["ardupilot_log_reader[pymavlink]"]

[dependency-groups]
dev = ["pytest>=8.3.3"]
